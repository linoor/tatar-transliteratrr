<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tatar transliteration</title>
  <link rel="stylesheet" href="styles.css">
  <script>var exports = {};</script>
  <script defer src="script.js"></script>
</head>
<body>
  <div class="container">
    <div class="controls">
      <label for="latinAlphabetSelect">Latin alphabet:</label>
      <select id="latinAlphabetSelect">
        <option value="NeoAlif" selected>Neo-əlif</option>
        <option value="Janalif">Jaꞑalif</option>
        <option value="ZamanAlif">Zamanälif</option>
      </select>
    </div>
    <textarea id="inputArea" placeholder="татарча бер нәрсә языгыз..."></textarea>
    <textarea id="outputArea" placeholder="tatarça ber nərsə yazığız..."></textarea>
    <details class="mappings">
      <summary>Show transliteration mappings</summary>
      <table class="mappingsTable">
        <thead>
          <tr>
            <th>Cyrillic</th>
            <th>Neo-əlif</th>
            <th>Jaꞑalif</th>
            <th>Zamanälif</th>
            <th>Note</th>
          </tr>
        </thead>
        <tbody>
          <tr><td>ә</td><td>ə</td><td>ə</td><td>ä</td><td>front vowel</td></tr>
          <tr><td>җ</td><td>c</td><td>ç</td><td>c</td><td></td></tr>
          <tr><td>ч</td><td>ç</td><td>c</td><td>ç</td><td></td></tr>
          <tr><td>ж</td><td>j</td><td>ƶ</td><td>j</td><td></td></tr>
          <tr><td>ң</td><td>ñ</td><td>ꞑ</td><td>ñ</td><td></td></tr>
          <tr><td>г</td><td>g / ğ</td><td>g / ƣ</td><td>g / ğ</td><td>depends on vowel context</td></tr>
          <tr><td>к</td><td>k / q</td><td>k / q</td><td>k / q</td><td>depends on vowel context</td></tr>
          <tr><td>ү</td><td>ü</td><td>y</td><td>ü</td><td></td></tr>
          <tr><td>й</td><td>y</td><td>j</td><td>y</td><td></td></tr>
          <tr><td>в</td><td>w</td><td>w</td><td>w</td><td></td></tr>
          <tr><td>ю</td><td>yu</td><td>ju</td><td>yu</td><td></td></tr>
          <tr><td>я</td><td>ya</td><td>ja</td><td>ya</td><td></td></tr>
          <tr><td>ё</td><td>yo</td><td>jo</td><td>yo</td><td></td></tr>
        </tbody>
      </table>
    </details>
  </div>
  <footer>
    <a href="https://github.com/linoor/tatar-transliteratrr">
      <img src="https://img.shields.io/badge/GitHub-Source%20Code-blue?logo=github" alt="GitHub" />
    </a>
  </footer>
</body>
</html>
